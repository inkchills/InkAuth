<style>

      </g>
    </svg>
    <h2>D1 · 等线全描边</h2>
    <p>墨滴与钥匙孔同一粗细的单线，<br>最均质、最"线稿"的一版。</p>

    </div>
  </div>

      <g fill="#1B2A4A">
        <circle cx="0" cy="-60" r="55"/>

      <div><svg width="48" height="51" viewBox="-300 -320 600 640"><path d="M 0 -252 C 48 -204 98 -164 140 -132 C 176 -104 188 -80 188 -48 C 188 70 128 170 0 248 C -128 170 -188 70 -188 -48 C -188 -80 -176 -104 -140 -132 C -98 -164 -48 -204 0 -252 Z" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><g fill="#1B2A4A"><circle cx="0" cy="-60" r="55"/><path d="M -26 -12 L 26 -12 L 44 110 L -44 110 Z"/></g></svg><span>48</span></div>
    </div>
  </div>

  <!-- D3 细线全描边 -->
  <div class="card">
    <svg class="main" viewBox="-300 -320 600 640">
      <g fill="none" stroke="#1B2A4A" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
