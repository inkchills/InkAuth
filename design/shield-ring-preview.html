<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>InkAuth · 完整盾 + 外部倒计时环</title>
<style>
  body { margin: 0; background: #ECEAF1; font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1B2A4A; }
  h1 { text-align: center; font-size: 22px; font-weight: 600; padding: 28px 0 4px; }
  p.sub { text-align: center; font-size: 13px; color: #6E7686; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(300px, 380px)); gap: 20px; justify-content: center; padding: 0 24px 48px; }
  .card { background: #F2F1F6; border-radius: 20px; padding: 24px; text-align: center; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 14px 0 4px; }
  .card p { font-size: 12px; color: #6E7686; margin: 0; line-height: 1.6; }
  .main { width: 280px; height: 280px; }
  .sizes { display: flex; align-items: flex-end; justify-content: center; gap: 20px; margin-top: 14px; }
  .sizes span { font-size: 10px; color: #9AA1AE; display: block; margin-top: 6px; }
  .sizes > div { text-align: center; }
</style>
</head>
<body>
<h1>InkAuth · 完整的盾 + 外部倒计时环</h1>
<p class="sub">盾牌闭合无缺口（安全无漏洞），时间流逝由外环表达</p>
<div class="grid">

  <!-- F1 细环 大缺口 -->
  <div class="card">
    <svg class="main" viewBox="-360 -360 720 720">
      <path d="M 42.5 -302.0 A 305 305 0 1 0 282.8 -114.3"
            fill="none" stroke="#1B2A4A" stroke-width="14" stroke-linecap="round"/>
      <g transform="scale(0.92)">
        <path d="M 0 -252 C 48 -204 98 -164 140 -132 C 176 -104 188 -80 188 -48 C 188 70 128 170 0 248 C -128 170 -188 70 -188 -48 C -188 -80 -176 -104 -140 -132 C -98 -164 -48 -204 0 -252 Z"
              fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
        <g fill="#1B2A4A">
          <circle cx="0" cy="-60" r="55"/>
          <path d="M -26 -12 L 26 -12 L 44 110 L -44 110 Z"/>
        </g>
      </g>
    </svg>
    <h2>F1 · 细环 · 大缺口</h2>
    <p>外环比盾牌线条细一圈，主次分明：<br>盾是主角，环是倒计时。</p>
    <div class="sizes">
      <div><svg width="96" height="96" viewBox="-360 -360 720 720"><path d="M 42.5 -302.0 A 305 305 0 1 0 282.8 -114.3" fill="none" stroke="#1B2A4A" stroke-width="14" stroke-linecap="round"/><g transform="scale(0.92)"><path d="M 0 -252 C 48 -204 98 -164 140 -132 C 176 -104 188 -80 188 -48 C 188 70 128 170 0 248 C -128 170 -188 70 -188 -48 C -188 -80 -176 -104 -140 -132 C -98 -164 -48 -204 0 -252 Z" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><g fill="#1B2A4A"><circle cx="0" cy="-60" r="55"/><path d="M -26 -12 L 26 -12 L 44 110 L -44 110 Z"/></g></g></svg><span>96</span></div>
      <div><svg width="48" height="48" viewBox="-360 -360 720 720"><path d="M 42.5 -302.0 A 305 305 0 1 0 282.8 -114.3" fill="none" stroke="#1B2A4A" stroke-width="14" stroke-linecap="round"/><g transform="scale(0.92)"><path d="M 0 -252 C 48 -204 98 -164 140 -132 C 176 -104 188 -80 188 -48 C 188 70 128 170 0 248 C -128 170 -188 70 -188 -48 C -188 -80 -176 -104 -140 -132 C -98 -164 -48 -204 0 -252 Z" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><g fill="#1B2A4A"><circle cx="0" cy="-60" r="55"/><path d="M -26 -12 L 26 -12 L 44 110 L -44 110 Z"/></g></g></svg><span>48</span></div>
    </div>
  </div>

  <!-- F2 等线环 大缺口 -->
  <div class="card">
    <svg class="main" viewBox="-360 -360 720 720">
      <path d="M 42.5 -302.0 A 305 305 0 1 0 282.8 -114.3"
            fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linecap="round"/>
      <g transform="scale(0.92)">
        <path d="M 0 -252 C 48 -204 98 -164 140 -132 C 176 -104 188 -80 188 -48 C 188 70 128 170 0 248 C -128 170 -188 70 -188 -48 C -188 -80 -176 -104 -140 -132 C -98 -164 -48 -204 0 -252 Z"
              fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
        <g fill="#1B2A4A">
          <circle cx="0" cy="-60" r="55"/>
          <path d="M -26 -12 L 26 -12 L 44 110 L -44 110 Z"/>
        </g>
      </g>
    </svg>
    <h2>F2 · 等线环 · 大缺口</h2>
    <p>环与盾同一线宽，整体性最强，<br>像一枚完整的印章。</p>
    <div class="sizes">
      <div><svg width="96" height="96" viewBox="-360 -360 720 720"><path d="M 42.5 -302.0 A 305 305 0 1 0 282.8 -114.3" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linecap="round"/><g transform="scale(0.92)"><path d="M 0 -252 C 48 -204 98 -164 140 -132 C 176 -104 188 -80 188 -48 C 188 70 128 170 0 248 C -128 170 -188 70 -188 -48 C -188 -80 -176 -104 -140 -132 C -98 -164 -48 -204 0 -252 Z" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><g fill="#1B2A4A"><circle cx="0" cy="-60" r="55"/><path d="M -26 -12 L 26 -12 L 44 110 L -44 110 Z"/></g></g></svg><span>96</span></div>
      <div><svg width="48" height="48" viewBox="-360 -360 720 720"><path d="M 42.5 -302.0 A 305 305 0 1 0 282.8 -114.3" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linecap="round"/><g transform="scale(0.92)"><path d="M 0 -252 C 48 -204 98 -164 140 -132 C 176 -104 188 -80 188 -48 C 188 70 128 170 0 248 C -128 170 -188 70 -188 -48 C -188 -80 -176 -104 -140 -132 C -98 -164 -48 -204 0 -252 Z" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><g fill="#1B2A4A"><circle cx="0" cy="-60" r="55"/><path d="M -26 -12 L 26 -12 L 44 110 L -44 110 Z"/></g></g></svg><span>48</span></div>
    </div>
  </div>

  <!-- F3 细环 小缺口 -->
  <div class="card">
    <svg class="main" viewBox="-360 -360 720 720">
      <path d="M 114.3 -282.8 A 305 305 0 1 0 246.7 -179.3"
            fill="none" stroke="#1B2A4A" stroke-width="14" stroke-linecap="round"/>

        <path d="M 0 -252 C 48 -204 98 -164 140 -132 C 176 -104 188 -80 188 -48 C 188 70 128 170 0 248 C -128 170 -188 70 -188 -48 C -188 -80 -176 -104 -140 -132 C -98 -164 -48 -204 0 -252 Z"

          <circle cx="0" cy="-60" r="55"/>
          <path d="M -26 -12 L 26 -12 L 44 110 L -44 110 Z"/>
        </g>
      </g>
    </svg>
    <h2>F3 · 细环 · 小缺口</h2>
    <p>缺口只有 32°，更像表盘指针走过的痕迹，<br>整体最安静。</p>
    <div class="sizes">
      <div><svg width="96" height="96" viewBox="-360 -360 720 720"><path d="M 114.3 -282.8 A 305 305 0 1 0 246.7 -179.3" fill="none" stroke="#1B2A4A" stroke-width="14" stroke-linecap="round"/><g transform="scale(0.92)"><path d="M 0 -252 C 48 -204 98 -164 140 -132 C 176 -104 188 -80 188 -48 C 188 70 128 170 0 248 C -128 170 -188 70 -188 -48 C -188 -80 -176 -104 -140 -132 C -98 -164 -48 -204 0 -252 Z" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><g fill="#1B2A4A"><circle cx="0" cy="-60" r="55"/><path d="M -26 -12 L 26 -12 L 44 110 L -44 110 Z"/></g></g></svg><span>96</span></div>
      <div><svg width="48" height="48" viewBox="-360 -360 720 720"><path d="M 114.3 -282.8 A 305 305 0 1 0 246.7 -179.3" fill="none" stroke="#1B2A4A" stroke-width="14" stroke-linecap="round"/><g transform="scale(0.92)"><path d="M 0 -252 C 48 -204 98 -164 140 -132 C 176 -104 188 -80 188 -48 C 188 70 128 170 0 248 C -128 170 -188 70 -188 -48 C -188 -80 -176 -104 -140 -132 C -98 -164 -48 -204 0 -252 Z" fill="none" stroke="#1B2A4A" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><g fill="#1B2A4A"><circle cx="0" cy="-60" r="55"/><path d="M -26 -12 L 26 -12 L 44 110 L -44 110 Z"/></g></g></svg><span>48</span></div>

  </div>

</div>
