<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>InkAuth 图标上线预览</title>
<style>
  body { margin: 0; font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #ECEAF1; color: #1B2A4A; }
  h1 { text-align: center; font-size: 20px; font-weight: 600; padding: 24px 0 2px; }
  p.sub { text-align: center; font-size: 12px; color: #6E7686; margin: 0 0 20px; }
  .row { display: flex; justify-content: center; gap: 40px; align-items: flex-end; padding: 12px 24px 8px; }
  .cell { text-align: center; }
  .cell span { display: block; font-size: 10px; color: #9AA1AE; margin-top: 8px; }
  .icon { border-radius: 26%; box-shadow: 0 2px 10px rgba(27,42,74,.14); }
  .dark .icon { box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .light-panel { background: #FDFCFE; padding: 20px 40px 24px; border-radius: 24px; }
  .dark-panel { background: #17181C; padding: 20px 40px 24px; border-radius: 24px; margin-top: 16px; }
  .dark-panel .cell span { color: #6B6F7A; }
  .label { text-align: center; font-size: 12px; color: #6E7686; margin: 6px 0 10px; }
</style>
</head>
<body>
<h1>InkAuth 图标 · 上线效果预览</h1>
<p class="sub">AppScope 分层图标（icon_background + icon_foreground）· 圆形面具模拟</p>

<div class="light-panel">
  <div class="label">浅色桌面</div>
  <div class="row">
    <div class="cell"><img class="icon" width="160" height="160" src="out/icon_preview.png"><span>160</span></div>
    <div class="cell"><img class="icon" width="96" height="96" src="out/icon_preview.png"><span>96</span></div>
    <div class="cell"><img class="icon" width="64" height="64" src="out/icon_preview.png"><span>64</span></div>
    <div class="cell"><img class="icon" width="48" height="48" src="out/icon_preview.png"><span>48</span></div>
  </div>
</div>

<div class="dark-panel dark">
  <div class="label" style="color:#8A8F9B">深色模式图标（dark 限定资源：#121318 底 + 柔白线条）</div>
  <div class="row">
    <div class="cell"><img class="icon" width="160" height="160" src="out/icon_preview_dark.png"><span>160</span></div>
    <div class="cell"><img class="icon" width="96" height="96" src="out/icon_preview_dark.png"><span>96</span></div>
    <div class="cell"><img class="icon" width="64" height="64" src="out/icon_preview_dark.png"><span>64</span></div>
    <div class="cell"><img class="icon" width="48" height="48" src="out/icon_preview_dark.png"><span>48</span></div>
  </div>
</div>

<p class="sub" style="margin-top:20px">浅色图标 = base 资源；深色图标 = dark 限定资源（系统深色模式自动切换）。应用内引导页/关于页深色主题使用 big_ic_logo_dark.svg（#BBC3FF）。</p>
</body>
</html>
